services:
  app_proxy:
    environment:
      APP_HOST: tubehaus_web_1
      APP_PORT: 8080

  # the web app and its router (Caddy); the server is reached by its Umbrel name
  web:
    image: ghcr.io/biolend83/tubehaus-web:1.5.1@sha256:b8b03b7d8e844cac2d0aec4972c5951af4b37645ff68526ff2e82aae2eebf109
    restart: on-failure
    environment:
      TUBEHAUS_SITE: ":8080"
      TUBEHAUS_AUTH: none
      TUBEHAUS_SERVER: tubehaus_server_1:3010
    depends_on:
      - server

  # the TubeHaus server: its own YouTube engine, the shared library, live streams and captions, offline saves.
  # HT_WARP=0: on a home connection YouTube needs no detour, so no extra capabilities.
  server:
    image: ghcr.io/biolend83/tubehaus:1.5.1@sha256:75416e3efb2cb83305df09bcd2db794507328926512d7646285923db9c2fbc56
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      HT_WARP: "0"
    volumes:
      - ${APP_DATA_DIR}/data/tubehaus:/data
