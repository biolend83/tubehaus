name: tubehaus

services:
  # the web app and its router (Caddy)
  web:
    container_name: tubehaus-web
    image: ghcr.io/biolend83/tubehaus-web:1.5.0
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8796"
        protocol: tcp
    environment:
      TUBEHAUS_SITE: ":8080"
      TUBEHAUS_AUTH: none
    depends_on:
      - tubehaus
      - invidious
    networks:
      - tubehaus

  # the TubeHaus server: the shared library, live streams and captions, offline saves.
  # HT_WARP=0: on a home connection YouTube needs no detour, so no extra capabilities.
  tubehaus:
    container_name: tubehaus-server
    image: ghcr.io/biolend83/tubehaus:1.5.0
    restart: unless-stopped
    init: true
    environment:
      HT_WARP: "0"
      HT_INVIDIOUS: http://invidious:3000
      HT_COMPANION: http://companion:8282
    volumes:
      - type: bind
        source: /DATA/AppData/tubehaus/server
        target: /data
    networks:
      - tubehaus

  invidious:
    container_name: tubehaus-invidious
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: tubehaus-db
          host: invidious-db
          port: 5432
        check_tables: true
        https_only: false
        use_innertube_for_captions: true
        invidious_companion:
        - private_url: "http://tubehaus:3010/companion"
        invidious_companion_key: tubehauscompanio
        hmac_key: tubehaus-change-this-hmac-key
    depends_on:
      - invidious-db
    networks:
      - tubehaus

  companion:
    container_name: tubehaus-companion
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    user: "10001:10001"
    environment:
      SERVER_SECRET_KEY: tubehauscompanio
      NETWORKING_FETCH_TIMEOUT_MS: "15000"
      NETWORKING_FETCH_RETRY_ENABLED: "true"
      NETWORKING_FETCH_RETRY_TIMES: "3"
      NETWORKING_FETCH_RETRY_INITIAL_DEBOUNCE: "200"
      NETWORKING_FETCH_RETRY_DEBOUNCE_MULTIPLIER: "2"
      JOBS_YOUTUBE_SESSION_FREQUENCY: "0 * * * *"
    shm_size: 256mb
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: tubehaus-companion
        target: /var/tmp/youtubei.js
    networks:
      - tubehaus

  invidious-db:
    container_name: tubehaus-db
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: tubehaus-db
    volumes:
      - type: bind
        source: /DATA/AppData/tubehaus/postgres
        target: /var/lib/postgresql/data
    networks:
      - tubehaus

networks:
  tubehaus:
    driver: bridge

volumes:
  tubehaus-companion:

x-casaos:
  id: io.github.biolend83.tubehaus
  architectures:
    - amd64
    - arm64
  main: web
  store_app_id: tubehaus
  category: Media
  author: biolend83
  developer: biolend83
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/TubeHaus/icon.svg
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/TubeHaus/screenshot-1.jpg
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/TubeHaus/screenshot-1.jpg
  title:
    en_US: TubeHaus
  tagline:
    en_US: Your own YouTube, without ads or tracking, for the whole household
    ko_KR: 광고와 추적 없는 우리 집 유튜브
  description:
    en_US: |
      TubeHaus is a YouTube app you host yourself. It looks and feels like YouTube, but there are no ads, no tracking and no account with Google: your subscriptions, history, playlists and resume points live on your own device, and every phone, computer and TV in the house sees the same library.

      It runs its own Invidious and Invidious Companion next to it, so nothing else needs to be installed.

      - Up to 4K, SponsorBlock, dubbed audio tracks, chapters, captions and translated subtitles
      - Live streams with live captions transcribed on your device
      - Send to TV, and watch together in a room that keeps everyone on the same moment
      - Offline save, a music mode with lyrics, and a big-screen mode for TVs
    ko_KR: |
      TubeHaus는 내 기기에서 직접 돌리는 유튜브 앱이에요. 화면과 사용감은 유튜브 그대로지만 광고와 추적이 없고 구글 계정도 필요 없어요. 구독, 시청 기록, 재생목록, 이어보기 위치가 내 기기에 저장되고, 집 안의 휴대폰·컴퓨터·TV 모두 같은 라이브러리를 봐요.

      Invidious와 Invidious Companion을 함께 돌리므로 따로 설치할 것이 없어요.
  tips:
    before_install:
      en_US: |
        Everyone who can open this address shares one library. To give each person their own, set TUBEHAUS_AUTH to "accounts" on both the web and tubehaus containers.
  port_map: "8796"
  scheme: http
  index: /
  version: "1.5.0"
  update_at: "2026-11-12"
  release_notes:
    en_US: First version in the CasaOS App Store.
  website: "https://github.com/biolend83/tubehaus"
  repo: "https://github.com/biolend83/tubehaus"
  support: "https://github.com/biolend83/tubehaus/issues"
  docs: "https://github.com/biolend83/tubehaus/blob/main/docs/SELF-HOSTING.md"
