name: Image

# Builds the TubeHaus container (server + WARP + yt-dlp + whisper.cpp) for amd64 and arm64
# on native runners and publishes it as ghcr.io/<owner>/tubehaus.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tubehaus

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The TubeHaus server (library, captions, offline saves). No web pages of its own: pair it with the tubehaus-web image (or Caddy and the web folder of the repository)
            org.opencontainers.image.licenses=AGPL-3.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          tags="-t $IMAGE:latest"
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            tags="$tags -t $IMAGE:${v#v}"
          fi
          echo "args=$tags" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.args }} \
            --annotation "index:org.opencontainers.image.description=The TubeHaus server (library, captions, offline saves). No web pages of its own: pair it with the tubehaus-web image (or Caddy and the web folder of the repository)" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Smoke test the published image
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            set -e
            test -x /opt/whisper/whisper-cli && test -s /opt/whisper/ggml-base-q5_1.bin && echo "whisper ok"
            /opt/venv/bin/yt-dlp --version
            ffmpeg -version | head -1
            warp-cli --version
            python3 -m py_compile /app/server/tubehaus_server.py && echo "server ok"'
