# A small V8 for the Android app's SABR engine: arm64, JIT on, and nothing the app doesn't use
# (no WebAssembly, no ICU, no Maglev, no inspector). The result is a static library the app's own
# JNI code links against, so the linker keeps only what is called.
name: V8 for Android
on:
  push:
    branches: [v8-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      V8_BRANCH: "13.0"
    steps:
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: V8 source
        run: |
          mkdir -p $HOME/v8 && cd $HOME/v8
          fetch --nohooks --no-history v8
          echo "target_os = ['android']" >> .gclient
          cd v8
          git fetch --depth 1 origin refs/branch-heads/$V8_BRANCH
          git checkout FETCH_HEAD
          gclient sync -D --no-history
          df -h /

      - name: Build
        run: |
          cd $HOME/v8/v8
          gn gen out/arm64 --args='
            target_os="android" target_cpu="arm64" is_debug=false is_component_build=false
            v8_monolithic=true v8_static_library=true v8_use_external_startup_data=false
            v8_enable_i18n_support=false v8_enable_webassembly=false v8_enable_maglev=false
            v8_enable_gdbjit=false v8_enable_vtunejit=false v8_enable_disassembler=false
            v8_enable_object_print=false v8_enable_verify_heap=false v8_enable_slow_dchecks=false
            v8_enable_debugging_features=false v8_enable_snapshot_compression=true
            symbol_level=0 use_custom_libcxx=false treat_warnings_as_errors=false
            optimize_for_size=true'
          ninja -C out/arm64 v8_monolith
          ls -la out/arm64/obj/libv8_monolith.a

      - name: Package
        run: |
          cd $HOME/v8/v8
          mkdir -p $HOME/out/lib
          cp out/arm64/obj/libv8_monolith.a $HOME/out/lib/
          cp -r include $HOME/out/include
          cp LICENSE* $HOME/out/ || true
          git rev-parse HEAD > $HOME/out/V8_COMMIT
          cat out/arm64/args.gn > $HOME/out/args.gn
          ls -la $HOME/out/lib

      - uses: actions/upload-artifact@v4
        with:
          name: v8-android-arm64
          path: ~/out
          retention-days: 30
