name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          fail=0
          for f in web/y/*.js web/y/lang/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Translations complete
        run: node scripts/i18n-check.mjs --strict

      - name: Python syntax
        run: python3 -m py_compile server/tubehaus_server.py

      - name: Server unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Server starts and answers
        run: |
          HT_STATE=/tmp/state HT_YT_PROXY= python3 server/tubehaus_server.py > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/api/p/health; then echo; exit 0; fi
            sleep 0.5
          done
          cat /tmp/server.log
          exit 1

      - name: flisk up --dry-run
        run: cp .env.example .env && npx --yes @flisk-sh/flisk@1.4.25 up --dry-run

      - name: Shell scripts
        run: bash -n deploy/entrypoint.sh
