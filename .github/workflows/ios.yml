name: iPad

# The iPad app for personal use: an unsigned .ipa as a build artifact (not a release). SideStore
# signs it with your own Apple ID when you install it. A second job runs the app in an iPad
# simulator and keeps screenshots and the log, as a check that it starts and draws.
on:
  push:
    branches: [ios-app]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  ipa:
    # Intel runners have twice the memory; linking Compose for iOS needs it
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin → TubeHausKit.framework
        run: |
          ./gradlew :ios:linkReleaseFrameworkIosArm64 --no-configuration-cache --stacktrace
          mkdir -p ios/build/kit && cp -R ios/build/bin/iosArm64/releaseFramework/TubeHausKit.framework ios/build/kit/
      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios/app && xcodegen generate
      - name: Build the app (unsigned)
        run: >-
          xcodebuild -project ios/app/TubeHaus.xcodeproj -scheme TubeHaus -sdk iphoneos -configuration Release
          -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package TubeHaus.ipa
        run: |
          set -e
          app=build/xcode/Build/Products/Release-iphoneos/TubeHaus.app
          test -x "$app/TubeHaus"
          mkdir -p out/Payload && cp -R "$app" out/Payload/
          cd out && zip -qr TubeHaus.ipa Payload && unzip -l TubeHaus.ipa | tail -3
          du -h TubeHaus.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TubeHaus-iPad
          path: out/TubeHaus.ipa
          if-no-files-found: error

  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin → TubeHausKit.framework (simulator)
        run: |
          ./gradlew :ios:linkDebugFrameworkIosX64 --no-configuration-cache --stacktrace
          mkdir -p ios/build/kit && cp -R ios/build/bin/iosX64/debugFramework/TubeHausKit.framework ios/build/kit/
      - name: Build for the simulator
        run: |
          brew install xcodegen
          (cd ios/app && xcodegen generate)
          xcodebuild -project ios/app/TubeHaus.xcodeproj -scheme TubeHaus -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/xcode ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Run it on an iPad
        # stopped here if it hangs, so the screenshots taken so far still get uploaded
        timeout-minutes: 25
        run: |
          set -x
          app=build/xcode/Build/Products/Debug-iphonesimulator/TubeHaus.app
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPad' in x['name']))")
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          mkdir -p shots
          # how busy the Mac is, every 20 s (a hang that starved the runner left no log at all)
          (while true; do date >> shots/top.txt; top -l 1 -o cpu -n 6 -stats pid,command,cpu,mem | tail -8 >> shots/top.txt; sleep 20; done) &
          # first start: the language question
          xcrun simctl launch "$udid" io.github.biolend83.tubehaus; sleep 25
          xcrun simctl io "$udid" screenshot shots/1-first-start.png
          xcrun simctl terminate "$udid" io.github.biolend83.tubehaus || true
          # past the first questions, in English
          data=$(xcrun simctl get_app_container "$udid" io.github.biolend83.tubehaus data)
          mkdir -p "$data/Library/Application Support/tubehaus"
          echo '{"lang":"en","welcomed":true}' > "$data/Library/Application Support/tubehaus/settings.json"
          xcrun simctl launch "$udid" io.github.biolend83.tubehaus; sleep 40
          xcrun simctl io "$udid" screenshot shots/2-home.png
          xcrun simctl terminate "$udid" io.github.biolend83.tubehaus || true
          # straight to a video (its related list comes from engine.js)
          xcrun simctl launch "$udid" io.github.biolend83.tubehaus -open jNQXAC9IVRw; sleep 45
          xcrun simctl io "$udid" screenshot shots/3-video.png
          xcrun simctl terminate "$udid" io.github.biolend83.tubehaus || true
          # TubePatch: a patch.js in the app's folder replaces the Kotlin duration() → "PATCHED <sec>" on the thumbnails
          mkdir -p "$data/Documents"
          echo 'var PATCH_VERSION = 99; var PATCHES = { "app.tubehaus.ui.duration": function (sec) { return "PATCHED " + sec; }, "app.tubehaus.ui.textOverride": function (key, lang) { return key === "Watch later" ? "LATER (patched)" : ""; } };' > "$data/Documents/patch.js"
          xcrun simctl launch "$udid" io.github.biolend83.tubehaus -open jNQXAC9IVRw; sleep 45
          xcrun simctl io "$udid" screenshot shots/4-patched.png
          ls "$data/Documents"
          # over and over: three videos, full screen on and off, twice (the app does it by itself with -stress)
          xcrun simctl terminate "$udid" io.github.biolend83.tubehaus || true; sleep 2
          rm -f "$data/Documents/patch.js"
          # 360p: this checks the picture moving between places, not how fast the simulator decodes
          echo '{"lang":"en","welcomed":true,"maxHeight":360}' > "$data/Library/Application Support/tubehaus/settings.json"
          xcrun simctl launch --terminate-running-process "$udid" io.github.biolend83.tubehaus -stress
          for i in $(seq -w 1 16); do sleep 8; xcrun simctl io "$udid" screenshot shots/5-stress-$i.png || echo "screenshot $i failed"; done
          xcrun simctl terminate "$udid" io.github.biolend83.tubehaus || true
          xcrun simctl spawn "$udid" log show --last 8m --style compact --predicate 'process == "TubeHaus"' > shots/app.log 2>&1 || true
          tail -60 shots/app.log
          ls ~/Library/Logs/DiagnosticReports/ | grep -i tubehaus && cp ~/Library/Logs/DiagnosticReports/*TubeHaus* shots/ || echo "no crash report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPad-simulator-check
          path: shots/
