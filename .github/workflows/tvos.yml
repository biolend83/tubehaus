name: Apple TV

# TubeHaus for Apple TV (tvos/): an unsigned .ipa as a build artifact, and a run in an Apple TV
# simulator with screenshots, as a check that it starts, draws and plays. Apple TV apps can't be
# sideloaded like the iPad one: installing needs Xcode on a Mac (free Apple ID) or TestFlight.
on:
  push:
    branches: [ios-app]
    paths: ["tvos/**", "ios/engine/**", ".github/workflows/tvos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project
        run: |
          brew install xcodegen
          cd tvos && xcodegen generate
      - name: Build the app (unsigned)
        run: >-
          xcodebuild -project tvos/TubeHausTV.xcodeproj -scheme TubeHausTV -sdk appletvos -configuration Release
          -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package TubeHaus-AppleTV.ipa
        run: |
          set -e
          app=build/xcode/Build/Products/Release-appletvos/TubeHaus.app
          test -x "$app/TubeHaus"
          mkdir -p out/Payload && cp -R "$app" out/Payload/
          cd out && zip -qr TubeHaus-AppleTV.ipa Payload && unzip -l TubeHaus-AppleTV.ipa | tail -3
          du -h TubeHaus-AppleTV.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TubeHaus-AppleTV
          path: out/TubeHaus-AppleTV.ipa
          if-no-files-found: error


  simulator:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and its walk-through for the simulator
        run: |
          brew install xcodegen
          (cd tvos && xcodegen generate)
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'tvOS' in k for x in v if 'Apple TV' in x['name']))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcodebuild build-for-testing -project tvos/TubeHausTV.xcodeproj -scheme TubeHausTV -destination "id=$udid" \
            -derivedDataPath build/xcode
      - name: Walk through it with the remote
        timeout-minutes: 30
        run: |
          set -x
          mkdir -p shots
          # the import screen, when the walk-through opens it, gets a YouTube Takeout file as a phone would send it
          ( for i in $(seq 1 200); do
              curl -sf --max-time 5 -X POST -H "Content-Type: text/plain" --data-binary @tvos/ci/subscriptions.csv http://127.0.0.1:8080/import && break
              sleep 3
            done ) &
          TEST_RUNNER_SHOTS="$PWD/shots" xcodebuild test-without-building -project tvos/TubeHausTV.xcodeproj -scheme TubeHausTV \
            -destination "id=$UDID" -derivedDataPath build/xcode -resultBundlePath shots/run.xcresult || echo "the walk-through failed"
          xcrun xcresulttool export attachments --path shots/run.xcresult --output-path shots/attachments || true
          ls -la shots shots/attachments || true
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'process == "TubeHaus"' > shots/app.log 2>&1 || true
          grep -i engine shots/app.log | tail -40; tail -60 shots/app.log
          ls ~/Library/Logs/DiagnosticReports/ | grep -i tubehaus && cp ~/Library/Logs/DiagnosticReports/*TubeHaus* shots/ || echo "no crash report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AppleTV-simulator-check
          path: |
            shots/*.png
            shots/attachments/
            shots/app.log
            shots/*.ips
