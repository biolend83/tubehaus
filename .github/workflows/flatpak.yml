# TubeHaus as a .flatpak file (packaging/flatpak): libmpv inside, so nothing to install on the system.
# Runs when the Flatpak files change and for each app release, which gets the file attached.
name: Flatpak

on:
  push:
    branches: [android-app]
    paths: [packaging/flatpak/**, .github/workflows/flatpak.yml]
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "attach the file to this release (app-v...)"
        required: false

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        run: |
          ./gradlew --no-daemon :desktop:createReleaseDistributable
          app=$(find desktop/build/compose/binaries/main-release/app -mindepth 1 -maxdepth 1 -type d | head -1)
          tar -C "$app" -cf app.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tar

  flatpak:
    needs: app
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Put the app next to the manifest
        run: mkdir -p packaging/flatpak/app && tar -C packaging/flatpak/app -xf app.tar && ls packaging/flatpak/app
      # flatpak-builder run directly, the SDK installed for this user next to the build: the action's
      # update of the image's own SDK failed with "Invalid cross-device link" (2026-11-15)
      - name: Build the Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo build packaging/flatpak/io.github.biolend83.TubeHaus.yml
          flatpak build-bundle repo TubeHaus.flatpak io.github.biolend83.TubeHaus
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          GITHUB_REF_NAME=$TAG
          ver=${GITHUB_REF_NAME#app-v}
          cp TubeHaus.flatpak "TubeHaus-$ver-linux-x86_64.flatpak"
          dnf install -y gh >/dev/null 2>&1 || true
          gh release upload "$GITHUB_REF_NAME" "TubeHaus-$ver-linux-x86_64.flatpak" --clobber --repo "$GITHUB_REPOSITORY"
