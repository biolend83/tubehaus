name: Engine check

# Every day: the apps' YouTube engine (android-app branch) runs each of its calls against live
# YouTube: search, streams, dubs, captions, channels, comments, playlists, downloads. When YouTube
# changes something and a call breaks, an issue is opened (or the open one gets a comment), so it
# is fixed before many people notice. GitHub's runners are data-center addresses, which YouTube
# asks to sign in, so by default the check goes out through Cloudflare WARP like a home server would.
on:
  schedule:
    - cron: "40 21 * * *"   # 06:40 in Korea
  workflow_dispatch:
    inputs:
      warp:
        description: "Go out through Cloudflare WARP"
        type: boolean
        default: true

# contents and pull-requests: when the player clients stop working, the repair step pushes a branch
# with a new clients.json and opens a pull request for it
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: engine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew --no-daemon :desktop:classes

      - name: Cloudflare WARP
        if: github.event_name == 'schedule' || inputs.warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          for i in 1 2 3 4 5; do warp-cli --accept-tos registration new && break; sleep 3; done
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            curl -s --max-time 5 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && break
            sleep 2
          done
          curl -s --max-time 10 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "warp=|loc="
          echo "TH_SOCKS=127.0.0.1:40000" >> "$GITHUB_ENV"

      - name: Run every engine call
        id: run
        env:
          TH_REPORT: ${{ runner.temp }}/failed.txt
        run: |
          set -o pipefail
          # "Sign in to confirm you're not a bot" is about the address this run got from WARP, not about
          # the engine: take a new address and run again (twice at most) before calling it a failure
          for try in 1 2 3; do
            rm -f "$TH_REPORT"
            if ./gradlew --no-daemon -q :desktop:engineCheck | tee "$RUNNER_TEMP/out.txt"; then exit 0; fi
            if [ "$try" = 3 ] || [ -z "$TH_SOCKS" ] || ! grep -q "not a bot" "$TH_REPORT" 2>/dev/null; then exit 1; fi
            echo "::notice::YouTube asked this WARP address to sign in; taking a new one (after try $try)"
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos registration delete || true
            for i in 1 2 3 4 5; do warp-cli --accept-tos registration new && break; sleep 3; done
            warp-cli --accept-tos mode proxy
            warp-cli --accept-tos connect
            for i in $(seq 1 20); do
              curl -s --max-time 5 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && break
              sleep 2
            done
          done

      # What breaks most often is the list of player clients (clients.json), not the code: the repair
      # tool asks every client it knows of (the file's, the app's own, and the ones yt-dlp and YouTube.js
      # use today) for a few videos, and when the list needs changing it writes a new one. That goes
      # on a branch with a pull request; merging it reaches installed apps within a day, with no release.
      - name: Look for player clients that still work
        id: repair
        if: failure() && steps.run.outcome == 'failure'
        env:
          TH_REPAIR_REPORT: ${{ runner.temp }}/repair.md
          TH_REPAIR_STATUS: ${{ runner.temp }}/repair.txt
          TH_REPORT: ${{ runner.temp }}/failed-after.txt
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon -q :desktop:engineRepair || true
          status=$(cat "$TH_REPAIR_STATUS" 2>/dev/null || echo none)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" = rewritten ] || exit 0
          # the whole check again with the new list: does it pass now?
          if ./gradlew --no-daemon -q :desktop:engineCheck > "$RUNNER_TEMP/out-after.txt" 2>&1; then echo "recheck=pass" >> "$GITHUB_OUTPUT"; else echo "recheck=fail" >> "$GITHUB_OUTPUT"; fi
          branch="engine-repair-$(date -u +%Y%m%d-%H%M)"
          git config user.name biolend83
          git config user.email 258010694+biolend83@users.noreply.github.com
          git checkout -q -b "$branch"
          git add clients.json
          git commit -q -m "clients.json: the player clients that work today"
          git push -q origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # the pull request needs "Allow GitHub Actions to create pull requests" in the repository's settings;
          # without it the issue links to the branch instead
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base android-app --head "$branch" --title "clients.json: the player clients that work today" --body-file "$TH_REPAIR_REPORT" 2>/dev/null || true)
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: failure() && steps.run.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          REPAIR: ${{ steps.repair.outputs.status }}
          REPAIR_BRANCH: ${{ steps.repair.outputs.branch }}
          REPAIR_PR: ${{ steps.repair.outputs.pr }}
          REPAIR_RECHECK: ${{ steps.repair.outputs.recheck }}
        with:
          script: |
            const fs = require("fs");
            const failed = fs.existsSync(process.env.RUNNER_TEMP + "/failed.txt") ? fs.readFileSync(process.env.RUNNER_TEMP + "/failed.txt", "utf8").trim() : "";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const repo = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const report = fs.existsSync(process.env.RUNNER_TEMP + "/repair.md") ? fs.readFileSync(process.env.RUNNER_TEMP + "/repair.md", "utf8").trim() : "";
            let repair = "";
            if (process.env.REPAIR === "rewritten") {
              const where = process.env.REPAIR_PR || `${repo}/compare/android-app...${process.env.REPAIR_BRANCH}?expand=1`;
              repair = `\n\n**A repaired client list is ready:** ${where}\nWith it the whole check ${process.env.REPAIR_RECHECK === "pass" ? "passes again" : "still fails (see the run log), so more than the client list is broken"}.\n\n<details><summary>What the repair tool found</summary>\n\n${report}\n</details>`;
            } else if (process.env.REPAIR === "fine") {
              repair = "\n\nThe player clients in clients.json still work, so this is in the code: someone has to look.";
            } else if (process.env.REPAIR === "stuck") {
              repair = `\n\nThe repair tool couldn't help:\n\n${report}`;
            }
            const body = `The daily engine check found calls that no longer work:\n\n\`\`\`\n${failed || "(the check itself didn't finish: see the run log)"}\n\`\`\`${repair}\n\n[Run log](${run})`;
            const title = "Engine check: YouTube calls failing";
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "engine-check" })).data;
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["engine-check"] });

      - name: Close the issue when all is well again
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "engine-check" })).data;
            for (const i of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: "Today's engine check passed again." });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
            }
