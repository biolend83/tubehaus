# XcodeGen: `xcodegen generate` here makes TubeHaus.xcodeproj (not kept in git).
# The Kotlin side is built first (./gradlew :ios:linkReleaseFrameworkIosArm64) and its
# TubeHausKit.framework copied to ios/build/kit (the workflow does both).
name: TubeHaus
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # the app's bundle id; the share extension's is this + ".share"
    APP_BUNDLE_ID: io.github.biolend83.tubehaus
targets:
  TubeHaus:
    type: application
    platform: iOS
    sources:
      - App.swift
      - Translator.swift
      - Assets.xcassets
      # the YouTube engine, built in (a newer one may sit in Files → On My iPad → TubeHaus)
      - path: ../engine/engine.js
        buildPhase: resources
      # TubePatch replacements, built in (a newer patch.js may sit in the same folder)
      - path: ../patch/patch.js
        buildPhase: resources
      # SABR (WebSabr): the page script and yt-dlp's solver it runs (common/sabr, common/ejs)
      - path: ../../common/sabr/sabr-page.js
        buildPhase: resources
      - path: ../../common/ejs/yt.solver.lib.min.js
        buildPhase: resources
      - path: ../../common/ejs/yt.solver.core.min.js
        buildPhase: resources
      # Pretendard, the typeface of the web app 1.0 (SIL Open Font License, common/fonts)
      - path: ../../common/fonts/PretendardVariable.ttf
        buildPhase: resources
      - path: ../../common/fonts/Pretendard-OFL.txt
        buildPhase: resources
    dependencies:
      - target: TubeHausShare
      - framework: ../build/kit/TubeHausKit.framework
        embed: false
      # comment translation (iOS 18+): linked weakly so the app still opens on iOS 16 and 17,
      # where this framework is missing or has no TranslationSession
      - sdk: Translation.framework
        weak: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: TubeHaus
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/kit"
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  # "Share → TubeHaus" from the YouTube app or Safari: the link opens in the app (tubehaus://open?url=…)
  TubeHausShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
    postBuildScripts:
      # the same version and build as the app, which keeps them in its Info.plist
      - name: Version of the app
        basedOnDependencyAnalysis: false
        # after Xcode has written the extension's Info.plist
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(SRCROOT)/Info.plist
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          for key in CFBundleShortVersionString CFBundleVersion; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$SRCROOT/Info.plist")
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist"
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        PRODUCT_NAME: TubeHausShare
        INFOPLIST_FILE: Share/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
