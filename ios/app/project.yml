# XcodeGen: `xcodegen generate` here makes TubeHaus.xcodeproj (not kept in git).
# The Kotlin side is built first (./gradlew :ios:linkReleaseFrameworkIosArm64) and its
# TubeHausKit.framework copied to ios/build/kit (the workflow does both).
name: TubeHaus
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  TubeHaus:
    type: application
    platform: iOS
    sources:
      - App.swift
      - Assets.xcassets
      # the YouTube engine, built in (a newer one may sit in Files → On My iPad → TubeHaus)
      - path: ../engine/engine.js
        buildPhase: resources
      # TubePatch replacements, built in (a newer patch.js may sit in the same folder)
      - path: ../patch/patch.js
        buildPhase: resources
    dependencies:
      - framework: ../build/kit/TubeHausKit.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.biolend83.tubehaus
        PRODUCT_NAME: TubeHaus
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/kit"
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
