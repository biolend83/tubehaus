<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TubeHaus</title>
<!-- The server's own settings: on a new server the first start (how it will be used, with the setup code
     from its log), afterwards the settings page its owner changes (STATE/config.json; .env wins over it). -->
<style>
  :root { --bg: #f9f9f9; --card: #fff; --fg: #0f0f0f; --fg2: #606060; --line: #e5e5e5; --blue: #065fd4; --soft: #f2f2f2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --card: #212121; --fg: #f1f1f1; --fg2: #aaa; --line: #3f3f3f; --blue: #3ea6ff; --soft: #2a2a2a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 Roboto, "Noto Sans KR", Arial, sans-serif; padding: 24px 16px 64px; }
  .card { width: 100%; max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; margin-bottom: 18px; }
  .logo a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 28px 0 4px; padding-top: 20px; border-top: 1px solid var(--line); }
  p.sub, .hint { color: var(--fg2); margin: 0 0 12px; font-size: 14px; }
  .hint { font-size: 12px; margin: 4px 0 0; }
  label.f { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input[type=text], input[type=password], input[type=number], input:not([type]), select, textarea { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; }
  select option { color: initial; }
  input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  input:disabled, select:disabled { opacity: .55; }
  .chk { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; font-size: 14px; cursor: pointer; }
  .chk input { margin-top: 4px; width: 16px; height: 16px; }
  .chk small { display: block; color: var(--fg2); font-size: 12px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  @media (max-width: 480px) { .modes { grid-template-columns: 1fr; } }
  .mode { text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .mode b { display: block; font-size: 15px; }
  .mode span { display: block; color: var(--fg2); font-size: 13px; margin-top: 2px; }
  .mode.on { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
  .go { width: 100%; height: 44px; margin-top: 24px; border: 0; border-radius: 22px; background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: default; }
  .ghost { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 17px; background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
  .err { color: #d93025; font-size: 14px; min-height: 20px; margin-top: 12px; }
  .ok { color: #188038; }
  .fixed { color: var(--fg2); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .links .row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 6px; margin-top: 6px; }
  .links .row button { width: 42px; }
  code { background: var(--soft); padding: 1px 6px; border-radius: 6px; font-size: 13px; word-break: break-all; }
  .langsel { margin-top: 20px; text-align: center; }
  .langsel select { width: auto; height: 34px; color: var(--fg2); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="logo"><a href="/"><svg width="30" height="20" viewBox="0 0 30 20"><rect width="30" height="20" rx="5.5" fill="#ff0033"/><path d="M12 6l8 4-8 4z" fill="#fff"/></svg>TubeHaus</a></div>
  <div id="box"></div>
  <div class="langsel"><select id="lang" aria-label="Language"></select></div>
</main>
<script type="module">
  import { $t, $tMsg, LANG, LANGS, ready } from "/y/i18n.js";
  ready.then(async () => {
  const $ = (id) => document.getElementById(id);
  const box = $("box");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  for (const [c, n] of LANGS) $("lang").append(new Option(n, c, false, c === LANG));
  $("lang").onchange = (e) => {
    let s = {};
    try { s = JSON.parse(localStorage.getItem("yt.settings") || "{}") || {}; } catch { }
    s.lang = e.target.value;
    try { localStorage.setItem("yt.settings", JSON.stringify(s)); } catch { }
    location.reload();
  };
  const call = async (path, body) => {
    let pw = "";
    try { pw = sessionStorage.getItem("th.adminpw") || ""; } catch { }
    const r = await fetch(path, {
      method: body ? "POST" : "GET", credentials: "same-origin",
      headers: { "Content-Type": "application/json", Accept: "application/json", ...(pw ? { "X-Admin-Password": encodeURIComponent(pw) } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error($tMsg(d.error || String(r.status))); e.need = d.need; e.status = r.status; throw e; }
    return d;
  };
  const health = await fetch("/api/p/health", { credentials: "same-origin" }).then((r) => r.json()).catch(() => ({}));
  if (health.setup) return firstStart();
  return settingsPage();

  // ---------------------------------------------------------------- a new server: how it will be used
  function firstStart() {
    const modes = [
      ["solo", $t("나 혼자"), $t("로그인해서 혼자 써요. 계정은 하나만 만들어져요.")],
      ["family", $t("가족"), $t("한 사람에 계정 하나씩, 구독과 기록이 따로예요.")],
      ["public", $t("누구나 (공개 서버)"), $t("모르는 사람도 써요. 라이브러리는 각자의 브라우저에 남아요.")],
      ["open", $t("로그인 없이"), $t("집 안 네트워크나 VPN에서만 열 때. 모두 라이브러리 하나를 같이 써요.")],
    ];
    box.innerHTML = `<h1>${$t("서버 설정 시작")}</h1>
      <p class="sub">${$t("처음 한 번만 하면 돼요. 나중에 설정 → 서버 설정에서 바꿀 수 있어요.")}</p>
      <form id="f" novalidate>
        <label class="f" for="code">${$t("설정 코드")}</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        <p class="hint">${$t("서버 로그에 있는 6자리 숫자예요. 도커라면: {0}", "<code>docker compose logs tubehaus</code>")}</p>
        <label class="f">${$t("어떻게 쓸 건가요?")}</label>
        <div class="modes">${modes.map(([k, t, s]) => `<button type="button" class="mode" data-m="${k}"><b>${esc(t)}</b><span>${esc(s)}</span></button>`).join("")}</div>
        <div id="more" hidden>
          <div data-for="solo family">
            <label class="f" for="u">${$t("내 계정 이름")}</label>
            <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24">
            <p class="hint">${$t("영문 소문자, 숫자, _ 로 3~24자")}</p>
            <label class="f" for="p">${$t("비밀번호")}</label>
            <input id="p" type="password" autocomplete="new-password" maxlength="200">
            <p class="hint">${$t("8자 이상")}</p>
          </div>
          <div data-for="family">
            <label class="f" for="max">${$t("계정 수 (이만큼 만들어지면 가입이 닫혀요)")}</label>
            <input id="max" type="number" min="1" max="100000" value="6">
            <label class="chk"><input id="guests" type="checkbox"><span>${$t("계정 없이 둘러보기 허용")}<small>${$t("손님의 구독과 기록은 그 브라우저에만 남아요")}</small></span></label>
          </div>
          <div data-for="public open">
            <label class="f" for="apw">${$t("설정 비밀번호")}</label>
            <input id="apw" type="password" autocomplete="new-password" maxlength="200">
            <p class="hint" id="apwh"></p>
          </div>
          <label class="f" for="name">${$t("서버 이름 (비우면 TubeHaus)")}</label>
          <input id="name" maxlength="40">
        </div>
        <button class="go" id="go" disabled>${$t("시작하기")}</button>
        <div class="err" id="err" role="alert"></div>
      </form>`;
    let mode = "";
    box.querySelectorAll(".mode").forEach((b) => (b.onclick = () => {
      mode = b.dataset.m;
      box.querySelectorAll(".mode").forEach((x) => x.classList.toggle("on", x === b));
      $("more").hidden = false;
      $("more").querySelectorAll("[data-for]").forEach((d) => (d.hidden = !d.dataset.for.split(" ").includes(mode)));
      $("apwh").textContent = mode === "public" ? $t("이 서버의 설정을 바꿀 때 물어봐요 (8자 이상)") : $t("비워 두면 이 서버를 열 수 있는 사람은 누구나 설정을 바꿀 수 있어요");
      $("go").disabled = false;
    }));
    $("code").focus();
    $("f").onsubmit = async (e) => {
      e.preventDefault();
      $("go").disabled = true;
      $("err").textContent = "";
      try {
        await call("/api/p/server/setup", { code: $("code").value, mode, username: $("u").value, password: $("p").value,
          max_accounts: $("max").value, guests: $("guests").checked, admin_password: $("apw").value, name: $("name").value });
        try { if ($("apw").value) sessionStorage.setItem("th.adminpw", $("apw").value); } catch { }
        location.replace("/");
      } catch (ex) {
        $("err").textContent = ex.message;
        $("go").disabled = false;
      }
    };
  }

  // ---------------------------------------------------------------- the settings page
  async function settingsPage() {
    let s;
    try { s = await call("/api/p/server/settings"); } catch (e) { return locked(e); }
    const V = s.values, F = new Set(s.fixed);
    const fx = (k) => (F.has(k) ? `<span class="fixed">${$t("(.env에서 정해져 있어요)")}</span>` : "");
    const dis = (k) => (F.has(k) ? " disabled" : "");
    const on = (k) => (V[k] === "1" ? " checked" : "");
    const heights = [["", $t("제한 없음")], ["2160", "2160p"], ["1440", "1440p"], ["1080", "1080p"], ["720", "720p"], ["480", "480p"]];
    let links = [];
    try { links = JSON.parse(V.HT_LINKS || "[]"); } catch { }
    if (!Array.isArray(links)) links = [];
    box.innerHTML = `<h1>${$t("서버 설정")}</h1>
      <p class="sub">${$t("이 서버를 쓰는 모든 사람에게 적용돼요. 저장하면 바로 바뀌어요.")}</p>
      <form id="f" novalidate>
        <label class="f" for="HT_NAME">${$t("서버 이름 (비우면 TubeHaus)")}${fx("HT_NAME")}</label>
        <input id="HT_NAME" maxlength="600" value="${esc(V.HT_NAME)}"${dis("HT_NAME")}>

        <h2>${$t("누가 쓰나요")}</h2>
        <label class="chk"><input id="HT_ACCOUNTS" type="checkbox"${on("HT_ACCOUNTS")}${dis("HT_ACCOUNTS")}><span>${$t("계정으로 로그인")}${fx("HT_ACCOUNTS")}<small>${$t("한 사람에 계정 하나씩, 구독과 기록이 따로예요.")}</small></span></label>
        <div id="owner" hidden>
          <p class="hint">${$t("먼저 내 계정을 만들어요. 이 계정이 서버 설정을 바꿀 수 있어요.")}</p>
          <label class="f" for="ou">${$t("내 계정 이름")}</label><input id="ou" autocomplete="username" autocapitalize="none" maxlength="24">
          <label class="f" for="op">${$t("비밀번호")}</label><input id="op" type="password" autocomplete="new-password" maxlength="200">
        </div>
        <div id="acc">
          <label class="f" for="HT_MAX_ACCOUNTS">${$t("계정 수 (이만큼 만들어지면 가입이 닫혀요)")}${fx("HT_MAX_ACCOUNTS")}</label>
          <input id="HT_MAX_ACCOUNTS" type="number" min="1" max="100000" placeholder="1000" value="${esc(V.HT_MAX_ACCOUNTS)}"${dis("HT_MAX_ACCOUNTS")}>
          <p class="hint">${$t("지금 계정 {0}개", s.accounts)}${s.owner ? " · " + $t("서버 주인: {0}", esc(s.owner)) : ""}</p>
          <label class="chk"><input id="HT_GUESTS" type="checkbox"${on("HT_GUESTS")}${dis("HT_GUESTS")}><span>${$t("계정 없이 둘러보기 허용")}${fx("HT_GUESTS")}<small>${$t("손님의 구독과 기록은 그 브라우저에만 남아요")}</small></span></label>
        </div>
        <label class="chk"><input id="HT_PUBLIC_MODE" type="checkbox"${on("HT_PUBLIC_MODE")}${dis("HT_PUBLIC_MODE")}><span>${$t("공개 서버")}${fx("HT_PUBLIC_MODE")}<small>${$t("모르는 사람도 써요. 라이브러리는 각자의 브라우저에 남아요.")}</small></span></label>
        <div id="adm">
          <label class="f" for="apw">${$t("설정 비밀번호")}</label>
          <input id="apw" type="password" autocomplete="new-password" maxlength="200" placeholder="${s.admin_password ? esc($t("바꿀 때만 입력")) : ""}">
          <p class="hint">${s.admin_password ? $t("설정 비밀번호가 있어요.") + ` <button type="button" class="ghost" id="apwdel">${$t("없애기")}</button>` : $t("비워 두면 이 서버를 열 수 있는 사람은 누구나 설정을 바꿀 수 있어요")}</p>
        </div>

        <h2>${$t("재생")}</h2>
        <label class="f" for="HT_MAX_HEIGHT">${$t("최대 화질")}${fx("HT_MAX_HEIGHT")}</label>
        <select id="HT_MAX_HEIGHT"${dis("HT_MAX_HEIGHT")}>${heights.map(([v, l]) => `<option value="${v}"${(V.HT_MAX_HEIGHT === "0" ? "" : V.HT_MAX_HEIGHT) === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>
        <label class="f" for="HT_SAVED_MAX_GB">${$t("서버에 보관할 동영상 용량 (GB)")}${fx("HT_SAVED_MAX_GB")}</label>
        <input id="HT_SAVED_MAX_GB" type="number" min="0" placeholder="50" value="${esc(V.HT_SAVED_MAX_GB)}"${dis("HT_SAVED_MAX_GB")}>
        <label class="f" for="HT_SUB_LANG">${$t("자막 번역 기본 언어 (예: ko, en)")}${fx("HT_SUB_LANG")}</label>
        <input id="HT_SUB_LANG" maxlength="12" placeholder="en" value="${esc(V.HT_SUB_LANG)}"${dis("HT_SUB_LANG")}>
        <label class="f" for="HT_WHISPER_LANG">${$t("실시간 자막 언어 (auto = 알아서)")}${fx("HT_WHISPER_LANG")}</label>
        <input id="HT_WHISPER_LANG" maxlength="12" placeholder="auto" value="${esc(V.HT_WHISPER_LANG)}"${dis("HT_WHISPER_LANG")}>

        <h2>${$t("부하 제한 (0 = 제한 없음)")}</h2>
        <label class="f" for="HT_MAX_VIEWERS">${$t("동시에 보는 사람 수")}${fx("HT_MAX_VIEWERS")}</label>
        <input id="HT_MAX_VIEWERS" type="number" min="0" placeholder="0" value="${esc(V.HT_MAX_VIEWERS)}"${dis("HT_MAX_VIEWERS")}>
        <label class="f" for="HT_RATE_PER_MIN">${$t("한 사람의 분당 요청 수 (비우면 공개 서버 120, 아니면 없음)")}${fx("HT_RATE_PER_MIN")}</label>
        <input id="HT_RATE_PER_MIN" type="number" min="0" value="${esc(V.HT_RATE_PER_MIN)}"${dis("HT_RATE_PER_MIN")}>

        <h2>${$t("메뉴 링크")}${fx("HT_LINKS")}</h2>
        <p class="hint">${$t("왼쪽 메뉴에 더할 링크예요")}</p>
        <div class="links" id="links"></div>
        <button type="button" class="ghost" id="addlink" style="margin-top:8px"${dis("HT_LINKS")}>${$t("링크 더하기")}</button>

        <h2>${$t("SSO (OpenID Connect)")}</h2>
        <p class="hint">${$t("계정으로 로그인할 때, 내 인증 서버(Authentik, Authelia, Keycloak 등)로도 로그인해요. 그쪽 리디렉션 주소: {0}", `<code>${esc(location.origin)}/api/p/auth/oidc/callback</code>`)}</p>
        <label class="f" for="HT_OIDC_ISSUER">${$t("발급자 주소")}${fx("HT_OIDC_ISSUER")}</label>
        <input id="HT_OIDC_ISSUER" placeholder="https://auth.example.com/application/o/tubehaus/" value="${esc(V.HT_OIDC_ISSUER)}"${dis("HT_OIDC_ISSUER")}>
        <label class="f" for="HT_OIDC_CLIENT_ID">${$t("클라이언트 ID")}${fx("HT_OIDC_CLIENT_ID")}</label>
        <input id="HT_OIDC_CLIENT_ID" value="${esc(V.HT_OIDC_CLIENT_ID)}"${dis("HT_OIDC_CLIENT_ID")}>
        <label class="f" for="HT_OIDC_CLIENT_SECRET">${$t("클라이언트 비밀")}${fx("HT_OIDC_CLIENT_SECRET")}</label>
        <input id="HT_OIDC_CLIENT_SECRET" type="password" autocomplete="off" placeholder="${s.secrets.HT_OIDC_CLIENT_SECRET ? esc($t("바꿀 때만 입력")) : ""}"${dis("HT_OIDC_CLIENT_SECRET")}>
        <label class="f" for="HT_OIDC_NAME">${$t("버튼에 보일 이름")}${fx("HT_OIDC_NAME")}</label>
        <input id="HT_OIDC_NAME" maxlength="40" placeholder="SSO" value="${esc(V.HT_OIDC_NAME)}"${dis("HT_OIDC_NAME")}>
        <label class="chk"><input id="HT_OIDC_ONLY" type="checkbox"${on("HT_OIDC_ONLY")}${dis("HT_OIDC_ONLY")}><span>${$t("비밀번호 로그인 끄기 (SSO로만)")}${fx("HT_OIDC_ONLY")}</span></label>

        <button class="go" id="go">${$t("저장")}</button>
        <div class="err" id="err" role="alert"></div>
      </form>`;
    const drawLinks = () => {
      $("links").innerHTML = links.map((l, i) => `<div class="row"><input data-i="${i}" data-k="name" placeholder="${esc($t("이름"))}" value="${esc(typeof l.name === "string" ? l.name : JSON.stringify(l.name || ""))}"${dis("HT_LINKS")}>
        <input data-i="${i}" data-k="url" placeholder="https://" value="${esc(l.url)}"${dis("HT_LINKS")}><button type="button" class="ghost" data-del="${i}"${dis("HT_LINKS")}>✕</button></div>`).join("");
    };
    drawLinks();
    $("links").oninput = (e) => { const t = e.target; if (t.dataset.i != null) links[+t.dataset.i][t.dataset.k] = t.value; };
    $("links").onclick = (e) => { const b = e.target.closest("[data-del]"); if (b) { links.splice(+b.dataset.del, 1); drawLinks(); } };
    $("addlink").onclick = () => { links.push({ name: "", url: "" }); drawLinks(); };
    let dropPw = false;
    $("apwdel") && ($("apwdel").onclick = () => { dropPw = true; $("apwdel").parentElement.textContent = $t("저장하면 설정 비밀번호가 없어져요"); });
    const sync = () => {
      const acc = $("HT_ACCOUNTS").checked;
      $("acc").hidden = !acc;
      $("adm").hidden = acc;
      $("owner").hidden = !(acc && !s.accounts && !F.has("HT_ACCOUNTS"));
    };
    $("HT_ACCOUNTS").onchange = sync;
    sync();
    $("f").onsubmit = async (e) => {
      e.preventDefault();
      $("go").disabled = true;
      $("err").textContent = "";
      $("err").classList.remove("ok");
      const values = {};
      for (const k of Object.keys(V)) {
        const el = $(k);
        if (!el || F.has(k)) continue;
        values[k] = el.type === "checkbox" ? el.checked : el.value;
      }
      if (!F.has("HT_LINKS")) values.HT_LINKS = JSON.stringify(links.filter((l) => l.url && l.name));
      const body = { values };
      if (!$("adm").hidden && ($("apw").value || dropPw)) body.admin_password = $("apw").value;
      if (!$("owner").hidden) body.owner = { username: $("ou").value, password: $("op").value };
      try {
        await call("/api/p/server/settings", body);
        if ("admin_password" in body) try { body.admin_password ? sessionStorage.setItem("th.adminpw", body.admin_password) : sessionStorage.removeItem("th.adminpw"); } catch { }
        // the page again from what the server now has (a new owner, the password asked or not, ...)
        await settingsPage();
        $("err").textContent = $t("저장했어요");
        $("err").classList.add("ok");
      } catch (ex) {
        $("err").textContent = ex.message;
        $("go").disabled = false;
      }
    };
  }

  // not allowed (yet): sign in, the settings password, or not the owner
  function locked(e) {
    if (e.need === "sign-in") return location.replace("/login?r=" + encodeURIComponent("/y/server.html"));
    if (e.need === "password" || e.need === "wrong" || e.need === "busy") {
      box.innerHTML = `<h1>${$t("서버 설정")}</h1><p class="sub">${$t("설정 비밀번호를 넣어 주세요")}</p>
        <form id="f"><input id="apw" type="password" autocomplete="current-password" maxlength="200"><button class="go">${$t("열기")}</button>
        <div class="err" id="err" role="alert">${e.need === "wrong" ? esc($t("비밀번호가 맞지 않아요")) : e.need === "busy" ? esc(e.message) : ""}</div></form>`;
      try { sessionStorage.removeItem("th.adminpw"); } catch { }
      $("apw").focus();
      $("f").onsubmit = (ev) => { ev.preventDefault(); try { sessionStorage.setItem("th.adminpw", $("apw").value); } catch { } settingsPage(); };
      return;
    }
    box.innerHTML = `<h1>${$t("서버 설정")}</h1><p class="sub">${e.need === "owner" ? esc($t("서버 주인만 설정을 바꿀 수 있어요")) : esc(e.message)}</p><p><a href="/">${$t("돌아가기")}</a></p>`;
  }
  });
</script>
</body>
</html>
